<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#4f46e5" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.2" />

  <!-- Power Symbol -->
  <g filter="url(#glow)">
    <!-- Arc -->
    <path d="M 180 180 A 120 120 0 1 0 332 180" fill="none" stroke="url(#ring)" stroke-width="32" stroke-linecap="round" />
    <!-- Center Line -->
    <line x1="256" y1="110" x2="256" y2="230" stroke="url(#ring)" stroke-width="32" stroke-linecap="round" />
  </g>
</svg>
